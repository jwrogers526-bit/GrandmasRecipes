<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Southern chicken and waffles illustration</title><desc id="desc">Golden waffles topped with crispy fried chicken and maple syrup on a ceramic plate.</desc>
